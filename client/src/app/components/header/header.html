<header
  class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 text-white"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-8">
    <!-- Zone 1: Wordmark -->
    <a
      routerLink="/"
      class="text-lg font-bold tracking-tight text-white whitespace-nowrap shrink-0 hover:text-blue-400 transition-colors flex items-center gap-2"
    >
      <span
        class="w-8 h-8 rounded bg-blue-600 flex items-center justify-center text-white font-mono font-bold text-sm"
        >CA</span
      >
      <span>Commissari d'Avaria</span>
    </a>

    <!-- Zone 2: Navigation Links (Continents) -->
    <nav class="hidden lg:flex items-center gap-5 text-sm font-medium text-slate-300">
      <a routerLink="/" class="hover:text-white transition-colors whitespace-nowrap shrink-0">
        Mappa Mondiale
      </a>
      <a
        routerLink="/continent/europa"
        class="hover:text-white transition-colors whitespace-nowrap shrink-0"
      >
        Europa
      </a>
      <a
        routerLink="/continent/asia"
        class="hover:text-white transition-colors whitespace-nowrap shrink-0"
      >
        Asia
      </a>
      <a
        routerLink="/continent/america-nord"
        class="hover:text-white transition-colors whitespace-nowrap shrink-0"
      >
        America del Nord
      </a>
      <a
        routerLink="/continent/america-sud"
        class="hover:text-white transition-colors whitespace-nowrap shrink-0"
      >
        America del Sud
      </a>
      <a
        routerLink="/continent/africa"
        class="hover:text-white transition-colors whitespace-nowrap shrink-0"
      >
        Africa
      </a>
      <a
        routerLink="/continent/oceania"
        class="hover:text-white transition-colors whitespace-nowrap shrink-0"
      >
        Oceania
      </a>
    </nav>

    <!-- Zone 3: Language switch -->
    <div class="flex items-center gap-3 shrink-0">
      <button
        type="button"
        (click)="toggleLanguage()"
        class="px-2.5 py-1 text-xs font-mono font-semibold rounded border border-slate-700 bg-slate-800 text-slate-200 hover:bg-slate-700 transition-colors whitespace-nowrap shrink-0 uppercase"
      >
        {{ currentLang }}
      </button>

    </div>
  </div>
</header>
