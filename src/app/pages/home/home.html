<div
  class="home-layout bg-slate-50 dark:bg-slate-900 font-sans text-slate-800 dark:text-slate-200"
  *transloco="let t"
>
  <!-- HERO SECTION -->
  <section class="relative z-10 bg-slate-900 text-white border-b border-slate-800">
    <div class="absolute inset-0 opacity-20 pointer-events-none">
      <img
        src="/assets/images/hero_maritime_survey_1792589834189.jpg"
        [attr.alt]="t('home.heroImageAlt')"
        referrerpolicy="no-referrer"
        class="w-full h-full object-cover"
      />
    </div>

    <div
      class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 grid items-center gap-3 md:grid-cols-[minmax(0,1fr)_minmax(16rem,22rem)] md:gap-8"
    >
      <div class="min-w-0 text-center md:text-left">
        <div class="text-xs font-mono text-blue-400 mb-1">
          <span>{{ t('home.eyebrow') }}</span>
        </div>

        <h1 class="text-lg sm:text-xl lg:text-2xl font-bold tracking-tight text-white text-balance">
          {{ t('home.title') }}
        </h1>
      </div>

      <!-- Quick Search Bar embedded in Hero -->
      <div class="w-full max-w-md mx-auto">
        <app-quick-search [compact]="true" />
      </div>
    </div>
  </section>

  <!-- Main content -->
  <main class="min-h-0 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-3">
    <!-- INTERACTIVE WORLD MAP SECTION -->
    <section id="mappa-mondo" class="h-full">
      <app-world-map (continentSelected)="onContinentSelected($event)" />
    </section>
  </main>
</div>
